<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ayaan Hussain's Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1 id="main-title">Ayaan Hussain's Portfolio</h1>
    <p>Welcome to my personal showcase on the web!</p>
  </header>

  <main>
    <section class="card">
      <h2>Interactive Zone</h2>
      <p>Want to play a quick game?</p>
      
      <button id="start-game-btn">Play Tic-Tac-Toe!</button>

      <div id="game-container" class="hidden">
        <div id="status-message">Player X's Turn</div>
        <div class="tic-tac-toe-board" id="board">
          <button class="cell" data-index="0"></button>
          <button class="cell" data-index="1"></button>
          <button class="cell" data-index="2"></button>
          <button class="cell" data-index="3"></button>
          <button class="cell" data-index="4"></button>
          <button class="cell" data-index="5"></button>
          <button class="cell" data-index="6"></button>
          <button class="cell" data-index="7"></button>
          <button class="cell" data-index="8"></button>
        </div>
        <button id="restart-btn">Restart Game</button>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Created by Ayaan Hussain</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
